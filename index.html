.pay-box{background:#0d7c3e;color:white;padding:15px;border-radius:12px;margin:10px 0;text-align:center}
.copy-btn{background:white;color:#0d7c3e;border:0;padding:8px 15px;border-radius:20px;font-weight:700;margin-top:8px}
input{width:100%;padding:12px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
